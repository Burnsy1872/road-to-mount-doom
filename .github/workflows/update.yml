name: Update ledger

on:
  schedule:
    - cron: "17 5 * * *"      # every morning, 05:17 UTC
  workflow_dispatch:           # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull activities from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/update_strava.py

      - name: Commit if anything changed
        run: |
          git config user.name  "ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "No change to the ledger."
          else
            git commit -m "Update ledger"
            git push
          fi
