name: Update ledger

on:
  schedule:
    - cron: "17 5 * * *"      # every morning, 05:17 UTC
    - cron: "47 17 * * *"     # evening fallback if the morning run is dropped
  workflow_dispatch:           # and on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Strava secrets
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID || secrets.CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
        run: |
          missing=0
          for name in STRAVA_CLIENT_ID STRAVA_CLIENT_SECRET STRAVA_REFRESH_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty. Add it as a repository secret (STRAVA_CLIENT_ID or CLIENT_ID)."
              missing=1
            fi
          done
          exit $missing

      - name: Pull activities from Strava
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID || secrets.CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET || secrets.CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN || secrets.REFRESH_TOKEN }}
        run: python scripts/update_strava.py

      - name: Commit if anything changed
        run: |
          git config user.name  "ledger-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          if git diff --staged --quiet; then
            echo "No change to the ledger."
          else
            git commit -m "Update ledger"
            git push
          fi
